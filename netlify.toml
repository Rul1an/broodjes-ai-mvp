[build]
      # Commando om de productie build te maken - with dependency fix
      command = "rm -rf node_modules package-lock.json && npm install && npm run build"
      # Map waar de Vue app code staat (relatief t.o.v. root)
      base    = "broodjes-app-vue"
      # Map waar de gebouwde bestanden komen (relatief t.o.v. base)
      publish = "dist"
      # Map met Netlify Functions (relatief t.o.v. root)
      functions = "netlify/functions"

# Configure Netlify Functions
[functions]
  node_bundler = "esbuild"
  # Global external modules for all functions
  external_node_modules = ["axios", "@supabase/supabase-js", "uuid", "openai"]

# Configuration specific for generate function
[functions."generate"]
  external_node_modules = ["axios", "@supabase/supabase-js", "uuid", "openai"]

# Configuration specific for getCostBreakdown function
[functions."getCostBreakdown"]
  external_node_modules = ["@supabase/supabase-js", "openai"]

# Configuration specific for startVisualizationTask function
[functions."startVisualizationTask"]
  external_node_modules = ["axios", "@supabase/supabase-js"]

# Configuration specific for getTaskStatus function
[functions."getTaskStatus"]
  external_node_modules = ["@supabase/supabase-js"]

# Configuration specific for refineRecipe function
[functions."refineRecipe"]
  external_node_modules = ["@supabase/supabase-js", "openai"]

# Configuration specific for visualize function
[functions."visualize"]
  external_node_modules = ["@supabase/supabase-js"]

# Configuration specific for triggerIngredientImageGeneration
[functions."triggerIngredientImageGeneration"]
  memory = 512 # Set memory to 512MB

[dev]
  command = "npm run dev"
  targetPort = 5174
  framework = "vite"
  functions = "netlify/functions"

# API redirects to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback for Vue Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
